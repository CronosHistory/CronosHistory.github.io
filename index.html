d forth! Every spot of the old world is overrun with oppression. Freedom hath been hunted round the globe. Asia, and Africa, have long expelled her.—Europe regards her like a stranger, and England hath given her warning to depart. O! receive the fugitive, and prepare in time an asylum for mankind.", "#Of the Present Ability of America: With Some Miscellaneous Reflections", "I have never met with a man, either in England or America, who hath not confessed his opinion, that a separation between the countries would take place one time or other: And there is no instance in which we have shown less judgment, than in endeavoring to describe, what we call, the ripeness or fitness of the continent for independence.", "As all men allow the measure, and vary only in their opinion of the time, let us, in order to remove mistakes, take a general survey of things, and endeavor if possible to find out the very time. But I need not go far, the inquiry ceases at once, for the time hath found us. The general concurrence, the glorious union of all things, proves the fact.", "’Tis not in numbers but in unity that our great strength lies: yet our present numbers are sufficient to repel the force of all the world. The Continent hath at this time the largest body of armed and disciplined men of any power under Heaven: and is just arrived at that pitch of strength, in which no single colony is able to support itself, and the whole, when united, is able to do any thing. Our land force is more than sufficient, and as to Naval affairs, we cannot be insensible that Britain would never suffer an American man of war to be built, while the Continent remained in her hands. Wherefore, we should be no forwarder an hundred years hence in that branch than we are now; but the truth is, we should be less so, because the timber of the Country is every day diminishing, and that which will remain at last, will be far off or difficult to procure.", "Were the Continent crowded with inhabitants, her sufferings under the present circumstances would be intolerable. The more seaport-towns we had, the more should we have both to defend and to lose. Our present numbers are so happily proportioned to our wants, that no man need be idle. The diminution of trade affords an army, and the necessities of an army create a new trade.", "Debts we have none: and whatever we may contract on this account will serve as a glorious memento of our virtue. Can we but leave posterity with a settled form of government, an independent constitution of its own, the purchase at any price will be cheap. But to expend millions for the sake of getting a few vile acts repealed, and routing the present ministry only, is unworthy the charge, and is using posterity with the utmost cruelty; because it is leaving them the great work to do, and a debt upon their backs from which they derive no advantage. Such a thought’s unworthy a man of honour, and is the true characteristic of a narrow heart and a piddling politician.", "The debt we may contract doth not deserve our regard if the work be but accomplished. No nation ought to be without a debt. A national debt is a national bond; and when it bears no interest, is in no case a grievance. Britain is oppressed with a debt of upwards of one hundred", "and forty millions sterling, for which she pays upwards of four millions interest. And as a compensation for her debt, she has a large navy; America is without a debt, and without a navy; yet for the twentieth part of the English national debt, could have a navy as large again. The navy of England is not worth at this time more than three millions and a half sterling. The first and second editions of this pamphlet were published without the following calculations, which are now given as a proof that the above estimation of the navy is a just one. See Entic’s “Naval History,” Intro., p. 56.", "The charge of building a ship of each rate, and furnishing her with masts, yards, sails, and rigging, together with a proportion of eight months boatswain’s and carpenter’s sea-stores, as calculated by Mr. Burchett, Secretary to the navy.", "~For a ship of 100 guns, ...... 35,553 £", "90 “ .......... 29,886", "80 “ .......... 23,638", "70 “ .......... 17,785", "60 “ .......... 14,197", "50 “ .......... 10,606", "40 “ .......... 7,558", "30 “ .......... 5,846", "20 “ .......... 3,710 And hence it is easy to sum up the value, or cost, rather, of the whole British navy, which, in the year 1757, when it was at its greatest glory, consisted of the following ships and guns.", "~Ships Guns Cost of One Cost of All", "~6 ... 100 .... 35,553 £ .... 213,318 £", "~12 ... 90 ..... 29,886 ...... 358,632", "~12 ... 80 ..... 23,638 ...... 283,656", "~43 ... 70 ..... 17,785 ...... 764,755", "~35 ... 60 ..... 14,197 ...... 496,895", "~40 ... 50 ..... 10,605 ...... 424,240", "~45 ... 40 ...... 7,558 ...... 340,110", "~58 ... 20 ...... 3,710 ...... 215,180", "85 sloops, bombs, and fireships,", "one with another at 2,000 ... 170,000", "~Cost, ..... 3,266,786 £", "Remains for guns, ....... 233,214", "~Total, ..... 3,500,000 £", "No country on the globe is so happily situated, or so internally capable of raising a fleet as America. Tar, timber, iron, and cordage are her natural produce. We need go abroad for nothing. Whereas the Dutch, who make large profits by hiring out their ships of war to the Spaniards and Portuguese, are obliged to import most of the materials they use. We ought to view the building a fleet as an article of commerce, it being the natural manufactory of this country. ’Tis the best money we can lay out. A navy when finished is worth more than it cost: And is that nice point in national policy, in which commerce and protection are united. Let us build; if we want them not, we can sell; and by that means replace our paper currency with ready gold and silver.", "In point of manning a fleet, people in general run into great errors; it is not necessary that one-fourth part should be sailors. The Terrible privateer, captain Death, stood the hottest engagement of any ship last war, yet had not twenty sailors on board, though her complement of men was upwards of two hundred. A few able and social sailors will soon instruct a sufficient number of active landsmen in the common work of a ship. Wherefore we never can be more capable of beginning on maritime matters than now, while our timber is standing, our fisheries blocked up, and our sailors and shipwrights out of employ. Men of war, of seventy and eighty guns, were built forty years ago in New England, and why not the same now? Ship building is America’s greatest pride, and in which she will, in time, excel the whole world. The great empires of the east are mainly inland, and consequently excluded from the possibility of rivalling her. Africa is in a state of barbarism; and no power in Europe hath either such an extent of coast, or such an internal supply of materials. Where nature hath given the one, she hath withheld the other; to America only hath she been liberal to both. The vast empire of Russia is almost shut out from the sea; wherefore her boundless forests, her tar, iron and cordage are only articles of commerce.", "In point of safety, ought we to be without a fleet? We are not the little people now which we were sixty years ago; at that time we might have trusted our property in the streets, or fields rather, and slept securely without locks or bolts to our doors and windows. The case is now altered, and our methods of defence ought to improve with our increase of property. A common pirate, twelve months ago, might have come up the Delaware, and laid the city of Philadelphia under contribution for what sum he pleased; and the same might have happened to other places. Nay, any daring fellow, in a brig of fourteen or sixteen guns, might have robbed the whole Continent, and carried off half a million of money. These are circumstances which demand our attention, and point out the necessity of naval protection. Some perhaps will say, that after we have made it up with Britain, she will protect us. Can they be so unwise as to mean that she will keep a navy in our harbors for that purpose? Common sense will tell us that the power which hath endeavoured to subdue us, is of all others the most improper to defend us. Conquest may be effected under the pretence of friendship; and ourselves, after a long and brave resistance, be at last cheated into slavery. And if her ships are not to be admitted into our harbours, I would ask, how is she going to protect us? A navy three or four thousand miles off can be of little use, and on sudden emergencies, none at all. Wherefore if we must hereafter protect ourselves, why not do it for ourselves? Why do it for another?", "The English list of ships of war is long and formidable, but not a tenth part of them are at any time fit for service, numbers of them are not in being; yet their names are pompously continued in the list; if only a plank be left of the ship; and not a fifth part of such as are fit for service can be spared on any one station at one time. The East and West Indies, Mediterranean, Africa, and other parts, over which Britain extends her claim, make large demands upon her navy. From a mixture of prejudice and inattention we have contracted a false notion respecting the navy of England, and have talked as if we should have the whole of it to encounter at once, and for that reason supposed that we must have one as large; which not being instantly practicable, has been made use of by a set of disguised Tories to", "discourage our beginning thereon. Nothing can be further from truth than this; for if America had only a twentieth part of the naval force of Britain, she would be by far an over-match for her; because, as we neither have, nor claim any foreign dominion, our whole force would be employed on our own coast where we should, in the long run, have two to one the advantage of those who had three or four thousand miles to sail over before they could attack us, and the same distance to return in order to refit and recruit. And although Britain, by her fleet, hath a check over our trade to Europe, we have as large a one over her trade to the West Indies, which, by laying in the neighborhood of the Continent, lies entirely at its mercy. Some method might be fallen on to keep up a naval force in time of peace, if we should judge it necessary to support a constant navy. If premiums were to be given to merchants to build and employ in their service ships mounted with twenty, thirty, forty, or fifty guns (the premiums to be in proportion to the loss of bulk to the merchant), fifty or sixty of those ships, with a few guardships on constant duty, would keep up a sufficient navy, and that without burdening ourselves with the evil so loudly complained of in England, of suffering their fleet in time of peace to lie rotting in the docks. To unite the sinews of commerce and defence is sound policy; for when our strength and our riches play into each other’s hand, we need fear no external enemy.", "In almost every article of defence we abound. Hemp flourishes even to rankness so that we need not want cordage. Our iron is superior to that of other countries. Our small arms equal to any in the world. Cannon we can cast at pleasure. Saltpetre and gunpowder we are every day producing. Our knowledge is hourly improving. Resolution is our inherent character, and courage hath never yet forsaken us. Wherefore, what is it that we want? Why is it that we hesitate? From Britain we can expect nothing but ruin. If she is once admitted to the government of America again, this Continent will not be worth living in. Jealousies will be always arising; insurrections will be constantly happening; and who will go forth to quell them? Who will venture his life to reduce his own countrymen to a foreign obedience? The difference between Pennsylvania and Connecticut, respecting some unlocated lands, shows the insignificance of a British government, and fully proves that nothing but Continental authority can regulate Continental matters.", "Another reason why the present time is preferable to all others is, that the fewer our numbers are, the more land there is yet unoccupied, which, instead of being lavished by the king on his worthless dependents, may be hereafter applied, not only to the discharge of the present debt, but to the constant support of government. No nation under Heaven hath such an advantage as this.", "The infant state of the Colonies, as it is called, so far from being against, is an argument in favour of independence. We are sufficiently numerous, and were we more so we might be less united. ’Tis a matter worthy of observation that the more a country is peopled, the smaller their armies are. In military numbers, the ancients far exceeded the moderns; and the reason is evident, for trade being the consequence of population, men became too much absorbed thereby to attend to anything else. Commerce diminishes the spirit both of patriotism and military defence. And history sufficiently informs us that the bravest achievements were always accomplished in the non-age of a nation. With the increase of commerce England hath lost its spirit. The city of London, notwithstanding its numbers, submits to continued insults with the patience of a coward. The more men have to lose, the less willing are they to venture. The rich are in general slaves to fear, and submit to courtly power with the trembling duplicity of a spaniel.", "Youth is the seed-time of good habits as well in nations as in individuals. It might be difficult, if not impossible, to form the Continent into one government half a century hence. The vast variety of interests, occasioned by an increase of trade and population, would create confusion. Colony would be against colony. Each being able would scorn each other’s assistance; and while the proud and foolish gloried in their little distinctions the wise would lament that the union had not been formed before. Wherefore the present time is the true", "time for establishing it. The intimacy which is contracted in infancy, and the friendship which is formed in misfortune, are of all others the most lasting and unalterable. Our present union is marked with both these characters; we are young, and we have been distressed; but our concord hath withstood our troubles, and fixes a memorable era for posterity to glory in. The present time, likewise, is that peculiar time which never happens to a nation but once, viz., the time of forming itself into a government. Most nations have let slip the opportunity, and by that means have been compelled to receive laws from their conquerors, instead of making laws for themselves. First, they had a king, and then a form of government; whereas the articles or charter of government should be formed first, and men delegated to execute them afterwards; but from the errors of other nations let us learn wisdom, and lay hold of the present opportunity—to begin government at the right end.", "When William the Conqueror subdued England, he gave them law at the point of the sword; and, until we consent that the seat of government in America be legally and authoritatively occupied, we shall be in danger of having it filled by some fortunate ruffian, who may treat us in the same manner, and then where will be our freedom? where our property? As to religion, I hold it to be the indispensable duty of government to protect all conscientious professors thereof, and I know of no other business which government hath to do therewith. Let a man throw aside that narrowness of soul, that selfishness of principle, which the niggards of all professions are so unwilling to part with, and he will be at once delivered of his fears on that head. Suspicion is the companion of mean souls, and the bane of all good society. For myself, I fully and conscientiously believe that it is the will of the Almighty that there should be a diversity of religious opinions among us. It affords a larger field for our Christian kindness; were we all of one way of thinking, our religious dispositions would want matter for probation; and on this liberal principle I look on the various denominations among us to be like children of the same family, differing only in what is called their Christian names. In page [97] I threw out a few thoughts on the propriety of a Continental Charter (for I only presume to offer hints, not plans) and in this place I take the liberty of re-mentioning the subject, by observing that a charter is to be understood as a bond of solemn obligation, which the whole enters into, to support the right of every separate part, whether of religion, professional freedom, or property. A firm bargain and a right reckoning make long friends. I have heretofore likewise mentioned the necessity of a large and equal representation; and there is no political matter which more deserves our attention. A small number of electors, or a small number of representatives, are equally dangerous. But if the number of the representatives be not only small, but unequal, the danger is increased. As an instance of this, I mention the following: when the petition of the associators was before the House of Assembly of Pennsylvania, twenty-eight members only were present; all the Bucks county members, being eight, voted against it, and had seven of the Chester members done the same, this whole province had been governed by two counties only; and this danger it is always exposed to. The unwarrantable stretch likewise, which that house made in their last sitting, to gain an undue authority over the delegates of that province, ought to warn the people at large how they trust power out of their own hands. A set of instructions for their delegates were put together, which in point of sense and business would have dishonoured a school-boy, and after being approved by a few, a very few, without doors, were carried into the house, and there passed in behalf of the whole colony; whereas, did the whole colony know with what ill will that house had entered on some necessary public measures, they would not hesitate a moment to think them unworthy of such a trust.", "Immediate necessity makes many things convenient, which if continued would grow into oppressions. Expedience and right are different things. When the calamities of America required a consultation, there was no method so ready, or at that time so proper, as to appoint persons from the several houses of assembly for that purpose; and the wisdom with which they have proceeded hath preserved this Continent from ruin. But as it is more than", "probable that we shall never be without a congress, every well wisher to good order must own that the mode for choosing members of that body deserves consideration. And I put it as a question to those who make a study of mankind, whether representation and election is not too great a power for one and the same body of men to possess? When we are planning for posterity, we ought to remember that virtue is not hereditary.", "It is from our enemies that we often gain excellent maxims, and are frequently surprised into reason by their mistakes. Mr. Cornwall (one of the Lords of the Treasury) treated the petition of the New York Assembly with contempt, because that house, he said, consisted but of twenty-six members, which trifling number, he argued, could not with decency be put for the whole. We thank him for his involuntary honesty.", "To conclude, however strange it may appear to some, or however unwilling they may be to think so, matters not, but many strong and striking reasons may be given to show that nothing can settle our affairs so expeditiously as an open and determined declaration for independence. Some of which are, First. — It is the custom of Nations, when any two are at war, for some other powers, not engaged in the quarrel, to step in as mediators, and bring about the preliminaries of a peace; But while America calls herself the subject of Great Britain, no power, however well disposed she may be, can offer her mediation. Wherefore, in our present state we may quarrel on for ever.", "Secondly. — It is unreasonable to suppose that France or Spain will give us any kind of assistance, if we mean only to make use of that assistance for the purpose of repairing the breach, and strengthening the connection between Britain and America; because, those powers would be sufferers by the consequences.", "Thirdly. — While we profess ourselves the subjects of Britain, we must, in the eyes of foreign nations, be considered as Rebels. The precedent is somewhat dangerous to their peace, for men to be in arms under the name of subjects; we, on the spot, can solve the paradox; but to unite resistance and subjection requires an idea much too refined for common understanding. Fourthly. — Were a manifesto to be published, and despatched to foreign Courts, setting forth the miseries we have endured, and the peaceful methods which we have ineffectually used for redress; declaring at the same time that not being able longer to live happily or safely under the cruel disposition of the British Court, we had been driven to the necessity of breaking off all connections with her; at the same time, assuring all such Courts of our peaceable disposition towards them, and of our desire of entering into trade with them; such a memorial would produce more good effects to this Continent than if a ship were freighted with petitions to Britain.", "Under our present denomination of British subjects, we can neither be received nor heard abroad; the custom of all Courts is against us, and will be so, until by an independence we take rank with other nations.", "These proceedings may at first seem strange and difficult, but like all other steps which we have already passed over, will in a little time become familiar and agreeable; and until an independence is declared, the Continent will feel itself like a man who continues putting off some unpleasant business from day to day, yet knows it must be done, hates to set about it, wishes it over, and is continually haunted with the thoughts of its necessity.", "#Appendix to the Third Edition", "Since the publication of the first edition of this pamphlet, or rather, on the same day on which it came out, the king’s speech made its appearance in this city. Had the spirit of prophecy", "directed the birth of this production, it could not have brought it forth at a more seasonable juncture, or at a more necessary time. The bloody-mindedness of the one, shows the necessity of pursuing the doctrine of the other. Men read by way of revenge. And the speech, instead of terrifying, prepared a way for the manly principles of independence. Ceremony, and even silence, from whatever motives they may arise, have a hurtful tendency when they give the least degree of countenance to base and wicked performances wherefore, if this maxim be admitted, it naturally follows, that the king’s speech, is being a piece of finished villany, deserved and still deserves, a general execration, both by the Congress and the people.", "Yet, as the domestic tranquillity of a nation, depends greatly on the chastity of what might properly be called national manners, it is often better to pass some things over in silent disdain, than to make use of such new methods of dislike, as might introduce the least innovation on that guardian of our peace and safety. And, perhaps, it is chiefly owing to this prudent delicacy, that the king’s speech hath not before now suffered a public execution. The speech, if it may be called one, is nothing better than a wilful audacious libel against the truth, the common good, and the existence of mankind; and is a formal and pompous method of offering up human sacrifices to the pride of tyrants.", "But this general massacre of mankind, is one of the privileges and the certain consequences of kings, for as nature knows them not, they know not her, and although they are beings of our own creating, they know not us, and are become the gods of their creators. The speech hath one good quality, which is, that it is not calculated to deceive, neither can we, even if we would, be deceived by it. Brutality and tyranny appear on the face of it. It leaves us at no loss: And every line convinces, even in the moment of reading, that he who hunts the woods for prey, the naked and untutored Indian, is less savage than the king of Britain. Sir John Dalrymple, the putative father of a whining jesuitical piece, fallaciously called, “The address of the people of England to the inhabitants of America,” hath perhaps from a vain supposition that the people here were to be frightened at the pomp and description of a king, given (though very unwisely on his part) the real character of the present one: “But,” says this writer, “if you are inclined to pay compliments to an administration, which we do not complain of (meaning the Marquis of Rockingham’s at the repeal of the Stamp Act) it is very unfair in you to withhold them from that prince, by whose NOD ALONE they were permitted to do any thing.” This is toryism with a witness! Here is idolatry even without a mask: And he who can calmly hear and digest such doctrine, hath forfeited his claim to rationality an apostate from the order of manhood and ought to be considered as one who hath not only given up the proper dignity of man, but sunk himself beneath the rank of animals, and contemptibly crawls through the world like a worm.", "However, it matters very little now what the king of England either says or does; he hath wickedly broken through every moral and human obligation, trampled nature and conscience beneath his feet, and by a steady and constitutional spirit of insolence and cruelty procured for himself an universal hatred. It is now the interest of America to provide for herself. She hath already a large and young family, whom it is more her duty to take care of, than to be granting away her property to support a power who is become a reproach to the names of men and christians, whose office it is to watch the morals of a nation, of whatsoever sect or denomination ye are of, as well as ye who are more immediately the guardians of the public liberty, if ye wish to preserve your native country uncontaminated by European corruption, ye must in secret wish a separation. But leaving the moral part to private reflection, I shall chiefly confine my further remarks to the following heads:", "First, That it is the interest of America to be separated from Britain.", "Secondly, Which is the easiest and most practicable plan, reconciliation or independence? with some occasional remarks.", "In support of the first, I could, if I judged it proper, produce the opinion of some of the ablest and most experienced men on this continent: and whose sentiments on that head, are not yet publicly known. It is in reality a self-evident position: for no nation in a state of foreign dependence, limited in its commerce, and cramped and fettered in its legislative powers, can ever arrive at any material eminence. America doth not yet know what opulence is; and although the progress which she hath made stands unparalleled in the history of other nations, it is but childhood compared with what she would be capable of arriving at, had she, as she ought to have, the legislative powers in her own hands. England is at this time proudly coveting what would do her no good were she to accomplish it; and the continent hesitating on a matter which will be her final ruin if neglected. It is the commerce and not the conquest of America by which England is to be benefited, and that would in a great measure continue, were the countries as independent of each other as France and Spain; because the specious errors of those who speak without reflecting. And among the many which I have heard, the following seems the most general, viz. that had this rupture happened forty or fifty years hence, instead of now, the continent would have been more able to have shaken off the dependence. To which I reply, that our military ability, at this time, arises from the experience gained in the last war, and which in forty or fifty years’ time, would be totally extinct. The continent would not, by that time, have a quitrent reserved thereon will always lessen, and in time will wholly support, the yearly expense of government. It matters not how long the debt is in paying, so that the lands when sold be applied to the discharge of it, and for the execution of which the Congress for the time being will be the continental trustees. I proceed now to the second head, viz. Which is the easiest and most practicable plan, reconciliation or independence; with some occasional remarks.", "He who takes nature for his guide, is not easily beaten out of his argument, and on that ground, I answer generally that independence being a single simple line, contained within ourselves; and reconciliation, a matter exceedingly perplexed and complicated, and in which a treacherous capricious court is to interfere, gives the answer without a doubt. The present state of America is truly alarming to every man who is capable of reflection. Without law, without government, without any other mode of power than what is founded on, and granted by, courtesy. Held together by an unexampled occurrence of sentiment, which is nevertheless subject to change, and which every secret enemy is endeavoring to dissolve. Our present condition is, Legislation without law; wisdom without a plan; a constitution without a name; and, what is strangely astonishing, perfect independence contending for dependence. The instance is without a precedent, the case never existed before, and who can tell what may be the event? The property of no man is secure in the present un-braced system of things. The mind of the multitude is left at random, and seeing no fixed object before them, they pursue such as fancy or opinion presents. Nothing is criminal; there is no such thing as treason wherefore, every one thinks himself at liberty to act as he pleases. The Tories would not have dared to assemble offensively, had they known that their lives, by that act, were forfeited to the laws of the state. A line of distinction should be drawn between English soldiers taken in battle, and inhabitants of America taken in arms. The first are prisoners, but the latter traitors. The one forfeits his liberty, the other his head.", "Notwithstanding our wisdom, there is a visible feebleness in some of our proceedings which gives encouragement to dissensions. The continental belt is too loosely buckled: And if something is not done in time, it will be too late to do any thing, and we shall fall into a state, in which neither reconciliation nor independence will be practicable. The king and his worthless adherents are got at their old game of dividing the continent, and there are not wanting among us printers who will be busy in spreading specious falsehoods. The artful and hypocritical letter which appeared a few months ago in two of the New York papers, and likewise in two others, is an evidence that there are men who want both judgment and honesty.", "It is easy getting into holes and corners, and talking of reconciliation: But do such men seriously consider how difficult the task is, and how dangerous it may prove, should the continent divide thereon? Do they take within their view all the various orders of men whose situation and circumstances, as well as their own, are to be considered therein? Do they put themselves in the place of the sufferer whose all is already gone, and of the soldier, who hath quitted all for the defence of his country? If their ill-judged moderation be suited to their own private situations only, regardless of others, the event will convince them that “they are reckoning without their host.”", "Put us, say some, on the footing we were in the year 1763: To which I answer, the request is not now in the power of Britain to comply with, neither will she propose it; but if it were, and even should be granted, I ask, as a reasonable question, By what means is such a corrupt and faithless court to be kept to its engagements? Another parliament, nay, even the present, may hereafter repeal the obligation, on the pretence of its being violently obtained, or unit wisely granted; and, in that case, Where is our redress? No going to law with nations; cannon are the barristers of crowns; and the sword, not of justice, but of war, decides the suit. To be on the footing of 1763, it is not sufficient, that the laws only be put in the same state, but, that our circumstances likewise be put in the same state; our burnt and destroyed towns repaired or built up, our private losses made good, our public debts (contracted for defence) discharged; otherwise we shall be millions worse than we were at that enviable period. Such a request, had it been complied with a year ago, would have won the heart and soul of the continent, but now it is too late. “The Rubicon is passed.” Besides, the taking up arms, merely to enforce the repeal of a pecuniary law, seems as unwarrantable by the divine law, and as repugnant to human feelings, as the taking up arms to enforce obedience thereto. The object, on either side, doth not justify the means; for the lives of men are too valuable to be cast away on such trifles. It is the violence which is done and threatened to our persons; the destruction of our property by an armed force; the invasion of our country by fire and sword, which conscientiously qualifies the use of arms: and the instant in which such mode of defence became necessary, all subjection to Britain ought to have ceased; and the independence of America should have been considered as dating its era from, and published by, the first musket that was fired against her. This line is a line of consistency; neither drawn by caprice, nor extended by ambition; but produced by a chain of events, of which the colonies were not the authors.", "I shall conclude these remarks, with the following timely and well-intended hints. We ought to reflect, that there are three different ways by which an independency may hereafter be effected, and that one of those three, will, one day or other, be the fate of America, viz. By the legal voice of the people in Congress; by a military power, or by a mob: It may not always happen that our soldiers are citizens, and the multitude a body of reasonable men; virtue, as I have already remarked, is not hereditary, neither is it perpetual. Should an independency be brought about by the first of those means, we have every opportunity and every encouragement before us, to form the noblest, purest constitution on the face of the earth. We have it in our power to begin the world over again. A situation, similar to the present, hath not happened since the days of Noah until now.", "The birthday of a new world is at hand, and a race of men, perhaps as numerous as all Europe contains, are to receive their portion of freedom from the events of a few months. The reflection is awful, and in this point of view, how trifling, how ridiculous, do the little paltry cavilings of a few weak or interested men appear, when weighed against the business of a world.", "Should we neglect the present favorable and inviting period, and independence be hereafter effected by any other means, we must charge the consequence to ourselves, or to those rather whose narrow and prejudiced souls are habitually opposing the measure, without either inquiring or reflecting. There are reasons to be given in support of independence which men should rather privately think of, than be publicly told of. We ought not now to be debating whether we shall be independent or not, but anxious to accomplish it on a firm, secure, and honorable basis, and uneasy rather that it is not yet began upon. Every day convinces us of its", "necessity. Even the Tories (if such beings yet remain among us) should, of all men, be the most solicitous to promote it; for as the appointment of committees at first protected them from popular rage, so, a wise and well established form of government will be the only certain means of continuing it securely to them. Wherefore, if they have not virtue enough to be Whigs, they ought to have prudence enough to wish for independence.", "In short, independence is the only bond that tie and keep us together. We shall then see our object, and our ears will be legally shut against the schemes of an intriguing, as well as cruel, enemy. We shall then, too, be on a proper footing to treat with Britain; for there is reason to conclude, that the pride of that court will be less hurt by treating with the American States for terms of peace, than with those, whom she denominates “rebellious subjects,” for terms of accommodation. It is our delaying in that, encourages her to hope for conquest, and our backwardness tends only to prolong the war. As we have, without any good effect therefrom, withheld our trade to obtain a redress of our grievances, let us now try the alternative, by independently redressing them ourselves, and then offering to open the trade. The mercantile and reasonable part of England, will be still with us; because, peace, with trade, is preferable to war without it. And if this offer be not accepted, other courts may be applied to. On these grounds I rest the matter. And as no offer hath yet been made to refute the doctrine contained in the former editions of this pamphlet, it is a negative proof, that either the doctrine cannot be refuted, or, that the party in favor of it are too numerous to be opposed. wherefore, instead of gazing at each other with suspicious or doubtful curiosity, let each of us hold out to his neighbor the hearty hand of friendship, and unite in drawing a line, which, like an act of oblivion, shall bury in forgetfulness every former dissension. Let the names of Whig and Tory be extinct; and let none other be heard among us, than those of a good citizen, an open and resolute friend, and a virtuous supporter of the rights of mankind, and of the free and independent States of America."];
